name: VS Code Settings File
id: vscode-settings
description: >
  VS Code workspace configuration files (.vscode/settings.json, .vscode/tasks.json,
  and .code-workspace files) can define tasks, terminal profiles, and settings that
  execute arbitrary commands. Opening a malicious repository in VS Code can trigger
  code execution through various auto-run mechanisms.
author: LOC Team
tags:
  - vscode
  - ide
  - code-execution

exploitation: |
  VS Code allows defining settings in `.vscode/settings.json`. These settings allow
  multiple configurations that can be used to execute code:

  ### JS/TS

  - `js/ts.tsserver.node.path` - Runs on JS/TS project loaded
  - `debug.javascript.defaultRuntimeExecutable` - Runs on JS/TS project loaded

  ### Python Related:

  (Require python extension to be installed)

  - `python.defaultInterpreterPath` - Runs on Python project loaded
  - `isort.path` - Runs on Python project loaded
  - `python.analysis.typeServerExecutable` - Runs on Python project loaded
  - `python.pipenvPath`
  - `python.poetryPath`
  - `python.pixiToolPath`
  - `python.testing.pytestPath`

  Most of these are executed automatically as soon as a python project is opened in vscode

  ### PHP
  - `php.validate.executablePath` - Runs on PHP project loaded

  ### C/C++

  (Requires C/C++ extension to be installed)

  - C_Cpp.default.compilerPath
  - C_Cpp.codeAnalysis.clangTidy.path

  ### Terminal settings
  - `terminal.integrated.env.linux`
  - `terminal.integrated.env.osx`
  - `terminal.integrated.env.windows`

  ### Others
  - `chat.tools.terminal.autoApprove`: Specify tools to be run by AI agents without approval, which can be abused to run malicious commands.
  ```

references:
  - url: https://code.visualstudio.com/docs/configure/settings
    description: VS Code User and workspace settings
