    description: Full list of npm configuration keys
  - url: https://blog.sonatype.com/dependency-confusion-how-i-hacked-into-apple-uber-and-airbnb
    description: Dependency confusion attack via scoped registry override
  - url: https://github.blog/changelog/2026-06-09-upcoming-breaking-changes-for-npm-v12
    description: NPMv12 changes to disable git dependencies by default
